name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "black==26.5.1" "ruff==0.15.17" "isort==8.0.1"

      - name: Black
        run: black --check .

      - name: Ruff
        run: ruff check .

      - name: isort
        run: isort --check-only .

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Fetch tags on main pushes so test_version_not_behind_latest_tag runs.
          # On PRs this is false — the test skips gracefully via pytest.skip.
          fetch-tags: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install system dependencies (WeasyPrint)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 \
            libcairo2 libcairo2-dev libgdk-pixbuf2.0-0 libffi-dev shared-mime-info

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install -e . --no-deps

      - name: Run tests
        run: pytest

      - name: Secret baseline check
        run: detect-secrets scan --baseline .secrets.baseline

  test-py313:
    name: Test (Python 3.13)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Fetch tags on main pushes so test_version_not_behind_latest_tag runs.
          # On PRs this is false — the test skips gracefully via pytest.skip.
          fetch-tags: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install system dependencies (WeasyPrint)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 \
            libcairo2 libcairo2-dev libgdk-pixbuf2.0-0 libffi-dev shared-mime-info

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install -e . --no-deps

      - name: Run tests
        run: pytest

      - name: Secret baseline check
        run: detect-secrets scan --baseline .secrets.baseline

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install "pip-audit==2.10.1"
          pip-audit -r requirements-lock.txt

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Pattern matching — fast local-style gate in CI
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Verified credential detection — confirms live secrets via provider APIs
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          extra_args: --results=verified,unknown
