version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # fastmcp, fastmcp-slim and mcp must move together (a lone major bump of one
      # fails pip resolution); first match wins, so this group is listed first.
      mcp-stack:
        patterns: ["fastmcp", "fastmcp-slim", "mcp", "mcp-types"]
      pip-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Lint tools are pinned in three places (requirements-lock.txt, ci.yml and
      # .pre-commit-config.yaml). Bump them together by hand, never one at a time.
      - dependency-name: "black"
      - dependency-name: "ruff"
      - dependency-name: "isort"
      # filelock 4 conflicts with pinned packages (pip ResolutionImpossible); revisit
      # when virtualenv and py-key-value-aio allow it.
      - dependency-name: "filelock"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Also pinned in .pre-commit-config.yaml; bump both together by hand.
      - dependency-name: "trufflesecurity/trufflehog"
